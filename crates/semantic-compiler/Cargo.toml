[package]
name = "codebase-semantic-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic prompt compiler and verifier for Codebase Workspace semantics"

[lib]
name = "codebase_semantic_compiler"
path = "src/lib.rs"

[dependencies]
codebase-fact-model = { path = "../fact-model" }
codebase-semantic-model = { path = "../semantic-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
pretty_assertions = "1"
