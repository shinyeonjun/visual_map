[package]
name = "codebase-workspace"
version = "1.0.0-demo.1"
default-run = "codebase-workspace"
license = "MIT"
description = "Local evidence-backed codebase workspace"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codebase_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codebase-workspace"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codebase-fact-model = { path = "../crates/fact-model" }
codebase-semantic-model = { path = "../crates/semantic-model" }
codebase-semantic-compiler = { path = "../crates/semantic-compiler" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2.2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
