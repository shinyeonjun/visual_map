<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f8faa'/%3E%3Cpath d='M8 11l8-4 8 4-8 4-8-4zm0 5l8 4 8-4m-16 5l8 4 8-4' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>백엔드 비주얼 맵</title>
  </head>

  <body>
    <div id="root">
      <main class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash-mark" aria-hidden="true">⌁</div>
        <strong>Visual Map</strong>
        <span>프로젝트 구조를 준비하는 중...</span>
      </main>
    </div>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f4f6f6; }
      .boot-splash {
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        color: #122228;
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-splash-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #122228;
        color: #75d4c0;
        font-size: 28px;
        font-weight: 700;
      }
      .boot-splash strong { font-size: 20px; letter-spacing: -.02em; }
      .boot-splash span { color: #6d7c80; }
      @media (prefers-reduced-motion: no-preference) {
        .boot-splash-mark { animation: boot-pulse 1.4s ease-in-out infinite; }
      }
      @keyframes boot-pulse { 50% { transform: translateY(-3px); opacity: .72; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
