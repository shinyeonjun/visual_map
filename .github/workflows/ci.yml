name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install contract-only Python provider
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock pyright@1.1.411
          "$PWD\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify product version
        shell: pwsh
        run: .\scripts\verify-product-version.ps1

      - name: Verify bundled-engine notices
        shell: pwsh
        run: .\scripts\verify-third-party-notices.ps1

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Check dead frontend code
        run: npm run deadcode

      - name: Test frontend
        run: npm test

      - name: Measure frontend coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc

      - name: Verify locked dependency inventory
        shell: pwsh
        run: .\scripts\generate-dependency-inventory.ps1 -VerifyOnly

      - name: Build integrated code engine candidate
        run: cargo +1.96.1 build --locked --release --manifest-path code_memory/rust/Cargo.toml

      - name: Build integrated database engine candidate
        run: cargo +1.96.1 build --locked --release -p database-memory-cli --manifest-path db_memory/Cargo.toml

      - name: Test database core contract and golden replay
        run: cargo +1.96.1 test --locked -p database-memory-core --manifest-path db_memory/Cargo.toml

      - name: Stage pinned engine candidates
        shell: pwsh
        run: |
          $manifestPath = ".\src-tauri\engines\manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json

          $candidates = @(
            [pscustomobject]@{
              Id = "codebase-memory"
              Source = ".\code_memory\rust\target\release\code-memory-language.exe"
              Target = ".\src-tauri\engines\code-memory-language.exe"
            }
            [pscustomobject]@{
              Id = "database-memory"
              Source = ".\db_memory\target\release\database-memory.exe"
              Target = ".\src-tauri\engines\database-memory.exe"
            }
          )

          foreach ($candidate in $candidates) {
            Copy-Item -LiteralPath $candidate.Source -Destination $candidate.Target -Force
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate.Target).Hash
            $engine = @($manifest.engines) | Where-Object id -eq $candidate.Id
            if ($null -eq $engine) {
              throw "Engine '$($candidate.Id)' is missing from the manifest."
            }
            if ($hash -ne $engine.executable.sha256) {
              $engine.developmentArtifacts = @([pscustomobject]@{ sha256 = $hash })
            }
          }

          if ($candidates.Count -gt 0) {
            $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          }

      - name: Prepare pinned engines
        shell: pwsh
        run: |
          .\scripts\prepare-engines.ps1 -AllowDevelopmentArtifact
          .\scripts\prepare-engines.ps1 -VerifyOnly -AllowDevelopmentArtifact

      - name: Smoke code engine JSON contract
        shell: pwsh
        env:
          CODE_MEMORY_REQUIRE_MANAGED_PROVIDERS: "1"
        run: .\scripts\smoke-code-engine-contract.ps1

      - name: Smoke code engine determinism
        shell: pwsh
        env:
          CODE_MEMORY_REQUIRE_MANAGED_PROVIDERS: "1"
        run: .\scripts\smoke-code-determinism.ps1

      - name: Smoke code evidence golden and negative fixtures
        shell: pwsh
        run: .\scripts\smoke-code-evidence.ps1

      - name: Smoke database engine metadata contract
        shell: pwsh
        run: .\scripts\smoke-rdb-productization.ps1 -DatabaseMemory .\src-tauri\engines\database-memory.exe

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        env:
          BACKEND_VISUAL_MAP_SKIP_PROVIDER_RESOURCES: "1"
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        env:
          BACKEND_VISUAL_MAP_SKIP_PROVIDER_RESOURCES: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test database adapter against the pinned sidecar
        env:
          BACKEND_VISUAL_MAP_SKIP_PROVIDER_RESOURCES: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml workspace::tests::database_memory_v2_adapter_round_trip_is_complete_and_metadata_only -- --ignored --exact

      - name: Build internal release-mode desktop binary
        env:
          BACKEND_VISUAL_MAP_BUILD_SCOPE: internal
          BACKEND_VISUAL_MAP_SKIP_PROVIDER_RESOURCES: "1"
        run: npx tauri build --no-bundle
